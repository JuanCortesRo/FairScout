name: deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Pytest del backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build del frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    concurrency: deploy
    steps:
      - uses: actions/checkout@v4
      - name: Copiar variables de entorno guardadas en el servidor
        run: cp ~/talentscout.env .env
      - name: Construir y levantar
        run: docker compose -p talentscout up -d --build --remove-orphans
      - name: Verificar salud
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://localhost/api/health
      - name: Limpiar imágenes viejas
        run: docker image prune -f
