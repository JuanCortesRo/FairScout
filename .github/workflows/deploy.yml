name: deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Pruebas y build de contenedores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Pytest del backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build del frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build de imágenes Docker
        run: |
          docker build --tag fairscout-backend:ci ./backend
          docker build --tag fairscout-web:ci ./frontend

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    concurrency: deploy
    steps:
      - uses: actions/checkout@v4
      - name: Copiar variables de entorno guardadas en el servidor
        run: cp ~/talentscout.env .env
      - name: Construir y levantar
        run: docker compose -p talentscout up -d --build --remove-orphans
      - name: Verificar salud
        # Se consulta el backend dentro de su contenedor: con HTTPS, Caddy responde a http://localhost
        # con una redirección (308) y curl -f la daría por buena aunque el backend esté caído.
        run: |
          for i in $(seq 1 30); do
            if docker compose -p talentscout exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"; then
              echo "Backend OK"; exit 0
            fi
            sleep 3
          done
          docker compose -p talentscout logs --tail 100 backend
          exit 1
      - name: Limpiar imágenes viejas
        run: docker image prune -f
