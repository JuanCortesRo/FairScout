<text x="600.0" y="48" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="24">AI Talent Scout — Arquitectura del sistema</text><rect x="40" y="205" width="770" height="845" rx="18" fill="#2a1f0c" stroke="#2fb5a9" stroke-width="1.5"/><text x="790" y="234" text-anchor="end" fill="#ececec" font-weight="700" font-size="15">Backend FastAPI — Servidor del evento (Docker Compose)</text><rect x="40" y="80" width="700" height="80" rx="12" fill="#3a2a0f" stroke="#2fb5a9" stroke-width="1.5"/><text x="390.0" y="115.5" text-anchor="middle" fill="#ececec" font-weight="700" font-size="15">Frontend React (Vite) — servido por Caddy</text><text x="390.0" y="134.5" text-anchor="middle" fill="#cfcfcf" font-size="13">Crear vacante · Confirmar requisitos · Carga masiva de CVs (PDF / DOCX)</text><rect x="230" y="250" width="400" height="56" rx="12" fill="#3a2a0f" stroke="#2fb5a9" stroke-width="1.5"/><text x="430.0" y="273.5" text-anchor="middle" fill="#ececec" font-weight="700" font-size="14">1. Vacante → requisitos</text><text x="430.0" y="292.5" text-anchor="middle" fill="#cfcfcf" font-size="13">POST /api/vacantes</text><rect x="230" y="340" width="400" height="56" rx="12" fill="#3a2a0f" stroke="#2fb5a9" stroke-width="1.5"/><text x="430.0" y="363.5" text-anchor="middle" fill="#ececec" font-weight="700" font-size="14">2. Carga y lectura</text><text x="430.0" y="382.5" text-anchor="middle" fill="#cfcfcf" font-size="13">POST /api/cvs · PyMuPDF · DOCX→PDF · OCR</text><rect x="230" y="420" width="400" height="56" rx="12" fill="#3a2a0f" stroke="#2fb5a9" stroke-width="1.5"/><text x="430.0" y="443.5" text-anchor="middle" fill="#ececec" font-weight="700" font-size="14">3. Anonimización y seguridad</text><text x="430.0" y="462.5" text-anchor="middle" fill="#cfcfcf" font-size="13">Presidio · detección de prompt injection</text><rect x="230" y="500" width="400" height="56" rx="12" fill="#3a2a0f" stroke="#2fb5a9" stroke-width="1.5"/><text x="430.0" y="523.5" text-anchor="middle" fill="#ececec" font-weight="700" font-size="14">4. Extracción de la ficha</text><text x="430.0" y="542.5" text-anchor="middle" fill="#cfcfcf" font-size="13">1 llamada por CV · datos con su línea de origen</text><rect x="230" y="580" width="400" height="56" rx="12" fill="#3a2a0f" stroke="#2fb5a9" stroke-width="1.5"/><text x="430.0" y="603.5" text-anchor="middle" fill="#ececec" font-weight="700" font-size="14">5. Limpieza de datos</text><text x="430.0" y="622.5" text-anchor="middle" fill="#cfcfcf" font-size="13">fechas · años de experiencia · solapes</text><rect x="230" y="660" width="400" height="56" rx="12" fill="#3a2a0f" stroke="#2fb5a9" stroke-width="1.5"/><text x="430.0" y="683.5" text-anchor="middle" fill="#ececec" font-weight="700" font-size="14">6. Evaluación por requisito</text><text x="430.0" y="702.5" text-anchor="middle" fill="#cfcfcf" font-size="13">1 llamada por CV · resultado + cita</text><rect x="230" y="740" width="400" height="56" rx="12" fill="#3a2a0f" stroke="#2fb5a9" stroke-width="1.5"/><text x="430.0" y="763.5" text-anchor="middle" fill="#ececec" font-weight="700" font-size="14">7. Verificación de citas</text><text x="430.0" y="782.5" text-anchor="middle" fill="#cfcfcf" font-size="13">rapidfuzz contra el texto original</text><rect x="230" y="820" width="400" height="56" rx="12" fill="#3a2a0f" stroke="#2fb5a9" stroke-width="1.5"/><text x="430.0" y="843.5" text-anchor="middle" fill="#ececec" font-weight="700" font-size="14">8. Puntaje · estado · confianza</text><text x="430.0" y="862.5" text-anchor="middle" fill="#cfcfcf" font-size="13">solo código · obligatorios y descalificantes</text><rect x="230" y="900" width="400" height="56" rx="12" fill="#3a2a0f" stroke="#2fb5a9" stroke-width="1.5"/><text x="430.0" y="923.5" text-anchor="middle" fill="#ececec" font-weight="700" font-size="14">9. Explicaciones</text><text x="430.0" y="942.5" text-anchor="middle" fill="#cfcfcf" font-size="13">fortalezas · brechas · recomendación</text><rect x="230" y="980" width="400" height="56" rx="12" fill="#3a2a0f" stroke="#2fb5a9" stroke-width="1.5"/><text x="430.0" y="1003.5" text-anchor="middle" fill="#ececec" font-weight="700" font-size="14">10. Resultados</text><text x="430.0" y="1022.5" text-anchor="middle" fill="#cfcfcf" font-size="13">GET /api/ranking · JSON con todos</text><path d="M430.0 396 V420" fill="none" stroke="#f0897a" stroke-width="1.6" marker-end="url(#a)"/><path d="M430.0 476 V500" fill="none" stroke="#f0897a" stroke-width="1.6" marker-end="url(#a)"/><path d="M430.0 556 V580" fill="none" stroke="#f0897a" stroke-width="1.6" marker-end="url(#a)"/><path d="M430.0 636 V660" fill="none" stroke="#f0897a" stroke-width="1.6" marker-end="url(#a)"/><path d="M430.0 716 V740" fill="none" stroke="#f0897a" stroke-width="1.6" marker-end="url(#a)"/><path d="M430.0 796 V820" fill="none" stroke="#f0897a" stroke-width="1.6" marker-end="url(#a)"/><path d="M430.0 876 V900" fill="none" stroke="#f0897a" stroke-width="1.6" marker-end="url(#a)"/><path d="M430.0 956 V980" fill="none" stroke="#f0897a" stroke-width="1.6" marker-end="url(#a)"/><rect x="60" y="600" width="130" height="120" rx="12" fill="#1d2a2a" stroke="#2fb5a9" stroke-width="1.5"/><text x="125.0" y="636.5" text-anchor="middle" fill="#ececec" font-weight="700" font-size="15">PostgreSQL</text><text x="125.0" y="655.5" text-anchor="middle" fill="#cfcfcf" font-size="13">fichas</text><text x="125.0" y="674.5" text-anchor="middle" fill="#cfcfcf" font-size="13">evaluaciones</text><text x="125.0" y="693.5" text-anchor="middle" fill="#cfcfcf" font-size="13">auditoría</text><path d="M190 688 H230" fill="none" stroke="#f0897a" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)" stroke-dasharray="6 5"/><rect x="860" y="228" width="300" height="80" rx="12" fill="#3a2a0f" stroke="#2fb5a9" stroke-width="1.5"/><text x="1010.0" y="254.0" text-anchor="middle" fill="#ececec" font-weight="700" font-size="15">Claude API</text><text x="1010.0" y="273.0" text-anchor="middle" fill="#cfcfcf" font-size="13">Requisitos</text><text x="1010.0" y="292.0" text-anchor="middle" fill="#cfcfcf" font-size="13">obligatorio · deseable · descalificante</text><rect x="860" y="488" width="300" height="80" rx="12" fill="#3a2a0f" stroke="#2fb5a9" stroke-width="1.5"/><text x="1010.0" y="514.0" text-anchor="middle" fill="#ececec" font-weight="700" font-size="15">Claude API</text><text x="1010.0" y="533.0" text-anchor="middle" fill="#cfcfcf" font-size="13">Llamada 1: Extracción</text><text x="1010.0" y="552.0" text-anchor="middle" fill="#cfcfcf" font-size="13">experiencia · formación · idiomas…</text><rect x="860" y="648" width="300" height="80" rx="12" fill="#3a2a0f" stroke="#2fb5a9" stroke-width="1.5"/><text x="1010.0" y="674.0" text-anchor="middle" fill="#ececec" font-weight="700" font-size="15">Claude API</text><text x="1010.0" y="693.0" text-anchor="middle" fill="#cfcfcf" font-size="13">Llamada 2: Evaluación</text><text x="1010.0" y="712.0" text-anchor="middle" fill="#cfcfcf" font-size="13">cumple · parcial · no cumple · sin info</text><rect x="860" y="888" width="300" height="80" rx="12" fill="#3a2a0f" stroke="#2fb5a9" stroke-width="1.5"/><text x="1010.0" y="914.0" text-anchor="middle" fill="#ececec" font-weight="700" font-size="15">Claude API</text><text x="1010.0" y="933.0" text-anchor="middle" fill="#cfcfcf" font-size="13">Llamada 3: Explicaciones</text><text x="1010.0" y="952.0" text-anchor="middle" fill="#cfcfcf" font-size="13">redacta a partir de lo calculado</text><path d="M630 278 H860" fill="none" stroke="#f0897a" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><path d="M630 528 H860" fill="none" stroke="#f0897a" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><path d="M630 688 H860" fill="none" stroke="#f0897a" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><path d="M630 928 H860" fill="none" stroke="#f0897a" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><path d="M300 160 V250" fill="none" stro