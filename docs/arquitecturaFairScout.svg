l(#a)" marker-start="url(#a)"/><rect x="761.0" y="1123" width="78.0" height="19" rx="4" fill="#131313"/><text x="800.0" y="1137" text-anchor="middle" fill="#cfcfcf" font-size="12">Entrevista</text><path d="M1010.0 1100 V968" fill="none" stroke="#f0897a" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)" stroke-dasharray="6 5"/><rect x="957.8" y="1023" width="104.39999999999999" height="19" rx="4" fill="#131313"/><text x="1010.0" y="1037" text-anchor="middle" fill="#cfcfcf" font-size="12">usa Claude API</text><text x="40" y="1235" fill="#cfcfcf" font-size="13">Despliegue: push a main → GitHub Actions (runner propio en el servidor) → docker compose up → Caddy en :80 / :443 con HTTPS</text><text x="40" y="1260" fill="#cfcfcf" font-size="13">Claude solo extrae, evalúa y redacta, un CV a la vez. El puntaje, el estado, la confianza y el ranking los calcula el código.</text>
