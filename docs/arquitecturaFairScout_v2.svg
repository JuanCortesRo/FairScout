<text x="430.0" y="1350.0" text-anchor="middle" fill="#ececec" font-size="15" font-weight="700">Frontend React — resultados</text>
<text x="430.0" y="1369.0" text-anchor="middle" fill="#cfcfcf" font-size="13">Ranking · detalle con evidencia resaltada en el CV · comparador · auditoría</text>
<text x="430.0" y="1388.0" text-anchor="middle" fill="#cfcfcf" font-size="13">Corregir un requisito · exportar XLSX · generar entrevista y ver el informe</text>
<rect x="860" y="1318" width="300" height="92" rx="12" fill="#24183a" stroke="#b58cf0" stroke-width="1.5"/>
<text x="1010.0" y="1350.0" text-anchor="middle" fill="#ececec" font-size="15" font-weight="700">Persona candidata</text>
<text x="1010.0" y="1369.0" text-anchor="middle" fill="#cfcfcf" font-size="13">Enlace público /entrevista/:token</text>
<text x="1010.0" y="1388.0" text-anchor="middle" fill="#cfcfcf" font-size="13">72 h · sin cuenta · límite de solicitudes</text>
<text x="40" y="1450" text-anchor="start" fill="#cfcfcf" font-size="13">Despliegue: PR → GitHub Actions en ubuntu-latest (pytest · npm run build · build de imágenes); push a main → runner self-hosted → docker compose up.</text>
<text x="40" y="1474" text-anchor="start" fill="#cfcfcf" font-size="13">Caddy sirve el frontend y redirige /api/* a backend:8000 (:80 o HTTPS con &lt;ip&gt;.sslip.io). Volúmenes: db (postgres:16) y uploads; el CV original se borra al procesarlo.</text>
<text x="40" y="1498" text-anchor="start" fill="#cfcfcf" font-size="13">Claude propone requisitos, extrae, evalúa y conduce la entrevista sobre texto anonimizado. Puntaje, estado, confianza, explicaciones y ranking los calcula el código.</text>
