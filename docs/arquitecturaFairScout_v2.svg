<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1530" viewBox="0 0 1200 1530" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="1530" fill="#131313"/>
<text x="600" y="44" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">FairScout — Arquitectura del sistema (v2)</text>
<text x="600" y="68" text-anchor="middle" fill="#cfcfcf" font-size="13">Estado actual del repositorio: pipeline completo, correcciones, exportación y agente entrevistador</text>
<rect x="40" y="92" width="780" height="86" rx="12" fill="#3a2a0f" stroke="#2fb5a9" stroke-width="1.5"/>
<text x="430.0" y="121.0" text-anchor="middle" fill="#ececec" font-size="14" font-weight="700">Frontend React 19 (Vite) — build estático servido por Caddy</text>
<text x="430.0" y="140.0" text-anchor="middle" fill="#cfcfcf" font-size="13">Vacantes · Nueva vacante y confirmación de requisitos · Carga de CVs (PDF / DOCX)</text>
<text x="430.0" y="159.0" text-anchor="middle" fill="#cfcfcf" font-size="13">store.jsx + api.js · modo demo con 60 CVs si /api/health no responde</text>
<rect x="860" y="92" width="300" height="86" rx="12" fill="#1a2433" stroke="#2fb5a9" stroke-width="1.5"/>
<text x="1010.0" y="121.0" text-anchor="middle" fill="#ececec" font-size="15" font-weight="700">Claude API (Anthropic)</text>
<text x="1010.0" y="140.0" text-anchor="middle" fill="#cfcfcf" font-size="13">Haiku 5.5 por defecto · prompts en app/prompts/</text>
<text x="1010.0" y="159.0" text-anchor="middle" fill="#cfcfcf" font-size="13">JSON validado con Pydantic + 1 reintento</text>
<rect x="40" y="228" width="780" height="1050" rx="18" fill="#2a1f0c" stroke="#2fb5a9" stroke-width="1.5"/>
<text x="800" y="254" text-anchor="end" fill="#ececec" font-size="14" font-weight="700">Backend FastAPI · Python 3.12 · Docker Compose</text>
<rect x="230" y="272" width="400" height="56" rx="12" fill="#3a2a0f" stroke="#2fb5a9" stroke-width="1.5"/>
<text x="430.0" y="295.5" text-anchor="middle" fill="#ececec" font-size="14" font-weight="700">1. Vacante → requisitos</text>
<text x="430.0" y="314.5" text-anchor="middle" fill="#cfcfcf" font-size="13">POST /api/vacantes · filtro de datos protegidos</text>
<rect x="230" y="347" width="400" height="56" rx="12" fill="#3a2a0f" stroke="#2fb5a9" stroke-width="1.5"/>
<text x="430.0" y="370.5" text-anchor="middle" fill="#ececec" font-size="14" font-weight="700">2. Confirmación del reclutador</text>
<text x="430.0" y="389.5" text-anchor="middle" fill="#cfcfcf" font-size="13">PUT /api/vacantes/{id} · nueva versión de requisitos</text>
<rect x="230" y="422" width="400" height="56" rx="12" fill="#3a2a0f" stroke="#2fb5a9" stroke-width="1.5"/>
<text x="430.0" y="445.5" text-anchor="middle" fill="#ececec" font-size="14" font-weight="700">3. Carga y lectura</text>
<text x="430.0" y="464.5" text-anchor="middle" fill="#cfcfcf" font-size="13">POST /api/vacantes/{id}/cvs · DOCX→PDF · PyMuPDF · OCR</text>
<rect x="230" y="497" width="400" height="56" rx="12" fill="#3a2a0f" stroke="#2fb5a9" stroke-width="1.5"/>
<text x="430.0" y="520.5" text-anchor="middle" fill="#ececec" font-size="14" font-weight="700">4. Anonimización y seguridad</text>
<text x="430.0" y="539.5" text-anchor="middle" fill="#cfcfcf" font-size="13">regex · contacto aparte · prompt injection · texto oculto</text>
<rect x="230" y="572" width="400" height="56" rx="12" fill="#3a2a0f" stroke="#2fb5a9" stroke-width="1.5"/>
<text x="430.0" y="595.5" text-anchor="middle" fill="#ececec" font-size="14" font-weight="700">5. Duplicados</text>
<text x="430.0" y="614.5" text-anchor="middle" fill="#cfcfcf" font-size="13">rapidfuzz · mismo contenido o contacto en la vacante</text>
<rect x="230" y="647" width="400" height="56" rx="12" fill="#3a2a0f" stroke="#2fb5a9" stroke-width="1.5"/>
<text x="430.0" y="670.5" text-anchor="middle" fill="#ececec" font-size="14" font-weight="700">6. Extracción de la ficha</text>
<text x="430.0" y="689.5" text-anchor="middle" fill="#cfcfcf" font-size="13">1 llamada por CV · líneas "p{n}-l{n}" anonimizadas</text>
<rect x="230" y="722" width="400" height="56" rx="12" fill="#3a2a0f" stroke="#2fb5a9" stroke-width="1.5"/>
<text x="430.0" y="745.5" text-anchor="middle" fill="#ececec" font-size="14" font-weight="700">7. Limpieza de la ficha</text>
<text x="430.0" y="764.5" text-anchor="middle" fill="#cfcfcf" font-size="13">fechas · años de experiencia · habilidades · idiomas A1–C2</text>
<rect x="230" y="812" width="400" height="56" rx="12" fill="#3a2a0f" stroke="#2fb5a9" stroke-width="1.5"/>
<text x="430.0" y="835.5" text-anchor="middle" fill="#ececec" font-size="14" font-weight="700">8. Evaluación por requisito</text>
<text x="430.0" y="854.5" text-anchor="middle" fill="#cfcfcf" font-size="13">POST /api/vacantes/{id}/evaluar · 1 llamada por CV</text>
<rect x="230" y="887" width="400" height="56" rx="12" fill="#3a2a0f" stroke="#2fb5a9" stroke-width="1.5"/>
<text x="430.0" y="910.5" text-anchor="middle" fill="#ececec" font-size="14" font-weight="700">9. Verificación de citas</text>
<text x="430.0" y="929.5" text-anchor="middle" fill="#cfcfcf" font-size="13">rapidfuzz contra las líneas citadas del CV</text>
<rect x="230" y="962" width="400" height="56" rx="12" fill="#3a2a0f" stroke="#2fb5a9" stroke-width="1.5"/>
<text x="430.0" y="985.5" text-anchor="middle" fill="#ececec" font-size="14" font-weight="700">10. Puntaje · estado · confianza</text>
<text x="430.0" y="1004.5" text-anchor="middle" fill="#cfcfcf" font-size="13">solo código · 60/40 · obligatorios y descalificantes</text>
<rect x="230" y="1037" width="400" height="56" rx="12" fill="#3a2a0f" stroke="#2fb5a9" stroke-width="1.5"/>
<text x="430.0" y="1060.5" text-anchor="middle" fill="#ececec" font-size="14" font-weight="700">11. Explicaciones</text>
<text x="430.0" y="1079.5" text-anchor="middle" fill="#cfcfcf" font-size="13">plantillas en código · fortalezas · brechas · por verificar</text>
<rect x="230" y="1112" width="400" height="56" rx="12" fill="#3a2a0f" stroke="#2fb5a9" stroke-width="1.5"/>
<text x="430.0" y="1135.5" text-anchor="middle" fill="#ececec" font-size="14" font-weight="700">12. Ranking y exportación</text>
<text x="430.0" y="1154.5" text-anchor="middle" fill="#cfcfcf" font-size="13">GET /api/ranking · correcciones del reclutador · XLSX</text>
<rect x="230" y="1197" width="400" height="56" rx="12" fill="#24183a" stroke="#b58cf0" stroke-width="1.5"/>
<text x="430.0" y="1220.5" text-anchor="middle" fill="#ececec" font-size="14" font-weight="700">13. Agente entrevistador</text>
<text x="430.0" y="1239.5" text-anchor="middle" fill="#cfcfcf" font-size="13">POST /api/entrevistas · plan → turnos → informe</text>
